# Lint gate for inferoute-client. Plan: inferoute-plans/client_reliability_audit_3d9b52e7.plan.md,
# section 18.
#
# Only changed lines are judged until item L1 clears the baseline (section 18.5):
# the check command passes --new-from-merge-base. Each structural item leaves the
# packages it touches clean and adds its depguard rules with the package.
#
# A deliberate exception is a //nolint with the linter's name and a reason.
# Run: go run ./internal/tools/check   (or golangci-lint run ./... for everything)
version: "2"

run:
  timeout: 5m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - noctx
    - contextcheck
    - forcetypeassert
    - errorlint
    - bodyclose
    - nilerr
    - unparam
    - exhaustive
    - gosec
    - depguard
    - forbidigo
    - nolintlint

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct layout for memory, not correctness
        - shadow # too noisy for the value it gives here

    exhaustive:
      default-signifies-exhaustive: true

    gosec:
      includes:
        - G110 # decompression without a size limit
        - G112 # http.Server without ReadHeaderTimeout (NET-5)
        - G114 # http.ListenAndServe/Serve without timeouts (NET-5)
        - G204 # subprocess launched with variable arguments: review once, then annotate
        - G402 # bad TLS settings
        - G404 # math/rand where randomness matters

    nolintlint:
      require-explanation: true
      require-specific: true

    depguard:
      rules:
        # Section 14, rule 8.
        testenv-only-in-tests:
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: github.com/sentnl/inferoute-node/inferoute-client/internal/testenv
              desc: "the fakes are for tests only; import internal/testenv from _test.go files"

    forbidigo:
      analyze-types: true
      forbid:
        # Section 18.3. Each pattern is a mistake the audit found.
        - pattern: ^exec\.Command$
          msg: "use exec.CommandContext so the process can be cancelled (ENG-4)"
        - pattern: ^context\.(Background|TODO)$
          msg: "use the caller's context; context.WithoutCancel(ctx) to detach. Allowed in cmd/ and tests (CLU-4)"
        - pattern: ^http\.(DefaultClient|Get|Post|PostForm|Head)$
          msg: "use a client with a timeout, built where section 14 rule 7 allows (CLU-1, QUAL-1)"
        - pattern: ^http\.NewRequest$
          msg: "use http.NewRequestWithContext"
        - pattern: ^time\.Sleep$
          msg: "wait on a timer or a context so the wait can be cancelled; allowed in tests (TST-4)"
        - pattern: ^fmt\.Print.*$
          msg: "log through the logger, or print in cmd/ and setup (QUAL-8)"
        - pattern: ^os\.(Stdout|Stderr)$
          msg: "take an io.Writer; the terminal belongs to cmd/ and setup (QUAL-8)"
        - pattern: ^os\.(Getenv|LookupEnv)$
          msg: "read the environment in cmd/, internal/config or a build-tagged platform file, and pass the value in"
        - pattern: ^runtime\.(GOOS|GOARCH)$
          msg: "take goos and goarch as parameters; read them in cmd/ or a build-tagged file (PLAT-2)"
        - pattern: ^testing\.(common|T|B|TB)\.Skip(f|Now)?$
          msg: "an invariant test is never skipped; only platform-specific and real-engine tests may skip, with a reason (section 17.5)"

  exclusions:
    rules:
      # As in the node: tests may use quick HTTP calls, unchecked assertions
      # and fixed arguments.
      - path: _test\.go$
        linters: [forcetypeassert, noctx, gosec, unparam]
      # Tests may wait, build contexts, read the environment and make quick
      # HTTP calls. The t.Skip rule still applies to them (section 17.5).
      - path: _test\.go$
        linters: [forbidigo]
        text: "(context\\.(Background|TODO)|time\\.Sleep|os\\.(Getenv|LookupEnv)|runtime\\.(GOOS|GOARCH)|fmt\\.Print|os\\.(Stdout|Stderr)|http\\.(DefaultClient|Get|Post|PostForm|Head|NewRequest)|exec\\.Command)"
      # The fakes are test code outside _test.go files.
      - path: ^internal/testenv/
        linters: [forbidigo, noctx, gosec]
      # cmd/ owns the process: the root context, the terminal, the environment.
      - path: ^cmd/
        linters: [forbidigo]
        text: "(context\\.(Background|TODO)|fmt\\.Print|os\\.(Stdout|Stderr)|os\\.(Getenv|LookupEnv)|runtime\\.(GOOS|GOARCH))"
      # The wizard talks to the operator on the terminal.
      - path: ^pkg/setup/
        linters: [forbidigo]
        text: "(fmt\\.Print|os\\.(Stdout|Stderr))"
      # Configuration is read here.
      - path: ^internal/config/
        linters: [forbidigo]
        text: "os\\.(Getenv|LookupEnv)"
      # Build-tagged platform files may read the platform and its environment.
      - path: _(windows|darwin|linux|unix|other)\.go$
        linters: [forbidigo]
        text: "(os\\.(Getenv|LookupEnv)|runtime\\.(GOOS|GOARCH))"
      # The check command is a developer tool: it prints and runs the toolchain.
      - path: ^internal/tools/
        linters: [forbidigo]
        text: "(context\\.Background|fmt\\.Print|os\\.(Stdout|Stderr)|os\\.(Getenv|LookupEnv)|runtime\\.(GOOS|GOARCH))"
